<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLC Lab: connecting to and programming PLCs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#E2E4DF; --surface:#F3F4F1; --surface2:#E9EBE6; --ink:#1D272F; --muted:#56626C;
  --line:#BCC1BA; --wire:#8A939A; --live:#178F4C; --liveglow:rgba(23,143,76,.22);
  --amber:#B97C00; --red:#C13D2B; --panel:#2A3640; --onpanel:#EEF1F2;
  --c1:#1F5FA8; --c1bg:#DCE7F5; --c2:#9A6400; --c2bg:#F6E7C8; --c3:#177A45; --c3bg:#D6EEDF; --c4:#7A3C99; --c4bg:#EBDDF2;
  --sans:"Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141A1F; --surface:#1D252C; --surface2:#242E36; --ink:#E5EAED; --muted:#9AA7B1;
    --line:#34414B; --wire:#5D6A74; --live:#3BD681; --liveglow:rgba(59,214,129,.22);
    --amber:#F0B33A; --red:#F27360; --panel:#0F1418; --onpanel:#E5EAED;
    --c1:#8DB8F0; --c1bg:#1D3150; --c2:#F0C068; --c2bg:#3D2F12; --c3:#7EDCA6; --c3bg:#173A28; --c4:#D3A6EA; --c4bg:#382546;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141A1F; --surface:#1D252C; --surface2:#242E36; --ink:#E5EAED; --muted:#9AA7B1;
  --line:#34414B; --wire:#5D6A74; --live:#3BD681; --liveglow:rgba(59,214,129,.22);
  --amber:#F0B33A; --red:#F27360; --panel:#0F1418; --onpanel:#E5EAED;
  --c1:#8DB8F0; --c1bg:#1D3150; --c2:#F0C068; --c2bg:#3D2F12; --c3:#7EDCA6; --c3bg:#173A28; --c4:#D3A6EA; --c4bg:#382546;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

/* Header: a nameplate, like an engraved panel tag */
header.top{background:var(--panel);color:var(--onpanel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .inner{max-width:720px;margin:0 auto;padding:12px 16px 10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
.brand h1 a{color:inherit;text-decoration:none;display:inline-flex;align-items:baseline;gap:5px;padding:4px 0}
.brand h1 a::before{content:"\2039";opacity:.6;font-weight:600}
.brand h1 a:hover{text-decoration:underline;text-underline-offset:3px}
.brand span{font-size:14px;opacity:.75}
.brand .ver{margin-left:auto;font-family:var(--mono);font-size:12px;opacity:.6}
.plats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.plats button{grid-column:span 2;min-width:0;background:transparent;border:1.5px solid rgba(255,255,255,.28);color:var(--onpanel);border-radius:6px;padding:7px 4px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plats button:nth-child(n+4){grid-column:span 3}
.plats button[aria-pressed="true"]{background:var(--onpanel);color:var(--panel);border-color:var(--onpanel)}

h2{font-size:21px;margin:22px 0 4px;font-weight:700}
h3{font-size:17px;margin:20px 0 6px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--muted)}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-weight:600;cursor:pointer;border-right:1.5px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:14px;color:var(--muted);font-weight:500;margin:14px 0 6px}

/* Ladder: the one bold element */
.ladder{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;margin-top:14px;padding:6px 2px}
.ladder svg{display:block;width:100%;height:auto}
.ladder .rail{stroke:var(--live);stroke-width:4}
.ladder .w{stroke:var(--wire);stroke-width:2.5;fill:none;transition:stroke .08s}
.ladder .w.on{stroke:var(--live);stroke-width:3.5;filter:drop-shadow(0 0 3px var(--liveglow))}
.ladder .cb{stroke:var(--ink);stroke-width:2.5}
.ladder .cfill{fill:transparent}
.ladder .cfill.on{fill:var(--live)}
.ladder .coil{fill:none;stroke:var(--ink);stroke-width:2.5}
.ladder .coil.on{stroke:var(--live);fill:var(--liveglow)}
.ladder .box{fill:var(--surface2);stroke:var(--ink);stroke-width:2}
.ladder text{fill:var(--ink);font-family:var(--sans);font-size:12px}
.ladder .addr{font-family:var(--mono);font-size:10.5px;fill:var(--c1)}
.ladder .tag{font-size:11px;fill:var(--muted)}
.ladder .big{font-weight:700;font-size:15px}
.ladder .val{font-family:var(--mono);font-size:12px;font-weight:700}
.ladder .ind{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.ladder .ind.on{fill:var(--live);stroke:var(--live)}
.ladder .indt{font-size:10px;font-weight:700}
.ladder .indt.on{fill:#fff}
.lamp{fill:var(--surface2);stroke:var(--ink);stroke-width:1.5}
.lamp.on{fill:var(--live);filter:drop-shadow(0 0 6px var(--live))}

/* Controls */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);color:var(--onpanel);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -3px 12px rgba(0,0,0,.25)}
.bar .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.inds{display:flex;align-items:center;gap:14px;min-width:0}
.pilot{display:flex;align-items:center;gap:8px}
.pilot b{display:block;font-size:14px}
.pilot small{display:block;font-family:var(--mono);font-size:11px;opacity:.75}
.plamp{width:40px;height:40px;border-radius:50%;flex:none;background:#3A4650;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15);transition:background .08s}
.plamp.on{background:var(--live);box-shadow:0 0 16px var(--live)}
.bits{display:flex;gap:8px}
.bl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}
.bl i{width:16px;height:16px;border-radius:50%;background:#3A4650;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.bl i.on{background:var(--live);box-shadow:0 0 8px var(--live)}
.acts{display:flex;gap:14px;flex:none}
.bar .switch,.bar .pb{flex:none;flex-direction:column;gap:3px;background:transparent;border:0;padding:0;color:var(--onpanel);text-align:center}
.bar .knob{width:44px;height:44px;background:#1A2228}
.bar .pb .cap{width:44px;height:44px}
.bar .switch b,.bar .pb b{font-size:13px}
.bar .switch small,.bar .pb small{color:var(--onpanel);opacity:.75;font-family:var(--mono);font-size:11px}
body.has-bar .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.switch{flex:1 1 150px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.knob{width:46px;height:46px;border-radius:50%;background:var(--panel);position:relative;flex:none;box-shadow:inset 0 0 0 3px var(--wire)}
.knob::after{content:"";position:absolute;left:50%;top:7px;width:6px;height:32px;margin-left:-3px;border-radius:3px;background:var(--onpanel);transform:rotate(-40deg);transform-origin:50% 16px;transition:transform .15s}
.switch[aria-pressed="true"] .knob::after{transform:rotate(40deg)}
.switch[aria-pressed="true"] .knob{box-shadow:inset 0 0 0 3px var(--live)}
.switch b{display:block;font-size:16px}
.switch small{color:var(--muted);font-size:13px}
.pb{flex:1 1 150px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;user-select:none;-webkit-user-select:none;touch-action:none}
.pb .cap{width:46px;height:46px;border-radius:50%;background:var(--red);flex:none;box-shadow:0 4px 0 color-mix(in srgb,var(--red) 55%,#000)}
.pb.held .cap{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 55%,#000)}
.pb b{display:block;font-size:16px}
.pb small{color:var(--muted);font-size:13px}

.status{width:100%;border-collapse:collapse;margin-top:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
.status td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.status tr:first-child td{border-top:0}
.status td:first-child{font-family:var(--mono);font-size:13px;color:var(--c1);white-space:nowrap}
.status td.v{font-family:var(--mono);font-weight:700;white-space:nowrap;width:5.5em}
.bit{display:inline-block;min-width:2.2em;text-align:center;border-radius:4px;padding:0 4px;background:var(--surface2);color:var(--muted)}
.bit.on{background:var(--live);color:#fff}
.status td.m{color:var(--muted);font-size:14px}

.chartbox{margin-top:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px}
.chartbox canvas{display:block;width:100%;height:210px}
.note{margin-top:14px;padding:12px 14px;border-left:4px solid var(--amber);background:var(--surface);border-radius:0 8px 8px 0}
.note p{margin:4px 0}
.try{margin-top:12px;padding:12px 14px;border-left:4px solid var(--live);background:var(--surface);border-radius:0 8px 8px 0}

.qtext code,.qexp code,.note code,.try code,p code{font-family:var(--mono);font-size:.9em;color:var(--c1)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Counters: momentary pushbuttons, one cap color per job */
.pb .cap,.pb.held .cap{background:var(--cap,var(--red))}
.pb .cap{box-shadow:0 4px 0 color-mix(in srgb,var(--cap,var(--red)) 55%,#000)}
.pb.held .cap{box-shadow:0 1px 0 color-mix(in srgb,var(--cap,var(--red)) 55%,#000)}
.pb.k-up{--cap:var(--live)} .pb.k-dn{--cap:var(--amber)} .pb.k-rs{--cap:var(--red)} .pb.k-ld{--cap:var(--c1)}
.bar .acts{gap:10px}
.bar .inds{gap:10px}
@media (max-width:400px){ .pilot small{display:none} .bar .pb b{font-size:12px} }

/* Compare: six instruction buttons in a 3 x 2 grid */
.seg.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.grid3 button:nth-child(3){border-right:0}
.seg.grid3 button:nth-child(n+4){border-top:1.5px solid var(--line)}
.seg.grid3 button{font-family:var(--mono);font-size:16px}
.seg.grid3 button.wide{grid-column:1/-1;border-top:1.5px solid var(--line);border-right:0;font-family:var(--sans);font-size:15px}
.ladder .cmpbox{transition:stroke .08s,fill .08s}
.ladder .cmpbox.on{stroke:var(--live);fill:var(--liveglow)}
/* Number line */
.ladder .shade{fill:var(--c3bg)}
.ladder .axis{stroke:var(--wire);stroke-width:2}
.ladder .tick{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.ladder .bmark{font-family:var(--mono);font-size:12px;font-weight:700;fill:var(--c1)}
.ladder .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.ladder #dot.on .dot{fill:var(--live);stroke:var(--live);filter:drop-shadow(0 0 5px var(--live))}
.ladder .dotv{font-family:var(--mono);font-size:9px;font-weight:700;fill:var(--ink)}
.ladder #dot{transition:transform .12s}
/* Results table */
.tt td{text-align:center;font-family:var(--mono)}
.tt tr.th td{font-family:var(--sans);font-weight:600;background:var(--surface2);color:var(--ink);font-size:14px}
.tt tr.cur td{background:var(--liveglow)}
.tt tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--live)}
.bar .cnt{font-family:var(--mono);font-size:18px;line-height:16px;min-width:2ch;text-align:center}
@media (prefers-reduced-motion: reduce){.ladder #dot{transition:none}}

/* Connecting */
#stepSeg button{font-family:var(--sans);font-size:14px;padding:9px 2px}
.cpu{margin:10px 0 0;font-size:14px;color:var(--muted)}
.ladder .node{fill:var(--surface2);stroke:var(--ink);stroke-width:2}
.ladder .node.pc{fill:var(--c1bg);stroke:var(--c1)}
.ladder .node.plc{fill:var(--c3bg);stroke:var(--c3)}
.ladder .nt{font-size:14px;font-weight:700;fill:var(--ink)}
.ladder .ns{font-size:12px;fill:var(--muted)}
.ladder .cab{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.ladder .cl{font-size:12px;font-weight:600;fill:var(--c2)}
.menus{display:grid;gap:6px;margin-top:4px}
.menu{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--c1);border-radius:0 8px 8px 0;padding:8px 10px;font-size:15px}
.checks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;counter-reset:ck}
.checks li{counter-increment:ck;background:var(--surface);border:1.5px solid var(--line);border-radius:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer}
.checks input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--live)}
.checks span::before{content:counter(ck) ". ";font-weight:700;color:var(--muted)}
.checks li.done{border-color:var(--live)}
.checks li.done span{color:var(--muted)}
.cprog{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.ghostb{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.trouble{margin-top:14px;padding:12px 14px;border-left:4px solid var(--red);background:var(--surface);border-radius:0 8px 8px 0}
.trouble .th2{display:block;margin-bottom:4px}
.trouble ul{margin:0;padding-left:18px}
.trouble li{margin:4px 0}
/* Comparison table: first column stays put, the rest scroll sideways */
.cmpwrap{overflow-x:auto;margin-top:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
.cmp{border-collapse:separate;border-spacing:0;font-size:15px;min-width:100%}
.cmp th,.cmp td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{border-top:0;background:var(--surface2);font-weight:700;white-space:nowrap}
.cmp td{min-width:150px;border-left:1px solid var(--line)}
.cmp td code{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--c1);white-space:nowrap}
.cmp td small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.cmp .rh{position:sticky;left:0;z-index:1;background:var(--surface2);width:112px;min-width:112px;max-width:112px;font-weight:600;font-size:14px;line-height:1.3;box-shadow:2px 0 0 var(--line)}
.cmp thead .rh{z-index:2}
.cmp tr.grp th{background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.cmp tr.grp td{background:var(--bg);border-left:0}
.cmp tr.grp + tr th,.cmp tr.grp + tr td{border-top:0}
.cmp tr.key td{background:var(--c2bg)}
.cmp td{font-size:14px}
.cmp td code{font-size:13px}
.swipe{font-size:14px;margin-top:6px}
.cmp thead.sr th{padding:0;height:0;line-height:0;font-size:0;border:0}
.stickhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdrH,0px));z-index:4;overflow:hidden;margin-top:12px;border:1.5px solid var(--line);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;background:var(--surface2)}
.stickhead .cmp th{border-top:0;padding:10px}
.stickhead.stuck{border-radius:0;box-shadow:0 -8px 0 var(--bg)}
#cmpWrap .cmpwrap{margin-top:0;border-top:0;border-radius:0 0 10px 10px}
body.wide .wrap{max-width:1040px}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand"><h1><a href="../" title="Back to PLC Lab home">PLC Lab</a></h1><span>Connecting</span><span class="ver">v1.2</span></div>
    <div class="plats" role="group" aria-label="PLC platform">
      <button data-plat="slc">SLC 500</button>
      <button data-plat="clx">CompactLogix</button>
      <button data-plat="s7">Siemens S7</button>
      <button data-plat="click">CLICK</button>
      <button data-plat="dl06">DL06</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="seg grid3" id="stepSeg" role="group" aria-label="Step">
      <button data-step="conn">1 Connect</button><button data-step="soft">2 Software</button><button data-step="io">3 I/O setup</button>
      <button data-step="down">4 Download</button><button data-step="up">5 Upload</button><button data-step="cmp">Compare all</button>
    </div>
    <p class="cpu" id="cpu"></p>
    <div id="methWrap" hidden>
      <div class="lbl">Connection</div>
      <div class="seg" id="methSeg" role="group" aria-label="Connection method"></div>
    </div>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <div class="ladder" id="chain" hidden></div>
    <div id="menuWrap" hidden><div class="lbl">Where to click</div><div class="menus" id="menus"></div></div>
    <div id="checkWrap">
      <div class="lbl" id="checkLbl">Checklist</div>
      <ol class="checks" id="checks"></ol>
      <div class="cprog"><span id="cprog"></span><button class="ghostb" id="clearBtn">Clear checks</button></div>
    </div>
    <div class="trouble" id="trouble" hidden></div>
    <div id="cmpWrap" hidden>
      <p class="swipe muted" id="swipeHint">Swipe the table sideways to see all five PLCs →</p>
      <div class="stickhead" id="stickHead" aria-hidden="true"></div>
      <div class="cmpwrap" id="cmpBox"></div>
    </div>
    <div class="note" id="noteBox"></div>
  </section>
</main>

<script>
(function(){
"use strict";
var store = {
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
var PLATS=["slc","clx","s7","click","dl06"], STEPS=["conn","soft","io","down","up","cmp"];
var state = { plat: store.get("rl-plat") || "slc", step: store.get("cn-step") || "conn", meth:{} };
if(PLATS.indexOf(state.plat)<0) state.plat="slc";
if(STEPS.indexOf(state.step)<0) state.step="conn";
var checks={}; try{ checks=JSON.parse(store.get("cn-checks")||"{}")||{} }catch(e){ checks={} }

/* ---------- The guide, one PLC at a time ----------
   chain: nodes top to bottom (PC first), cables between them. */
var P = {
  slc:{ name:"SLC 500", cpu:"SLC 5/03 (1747-L532) · RSLogix 500 + RSLinx Classic",
    meth:[
      {id:"uic", label:"1747-UIC → Channel 1",
        chain:[["PC","USB port"],["1747-UIC","USB to DH-485 / RS-232"],["SLC 5/03","Channel 1: DH-485 (RJ45)"]], cables:["USB cable (A to B)","1747-C13 cable (DH-485)"],
        desc:"The 1747-UIC turns the PC’s USB port into a DH-485 port. Plug it into Channel 1, the RJ45-style DH-485 port on the 5/03.",
        checks:["Install the 1747-UIC driver on the PC, then plug the UIC into a USB port.","Connect the UIC’s DH-485 port to <b>Channel 1</b> on the 5/03 with the 1747-C13 cable.","Open <b>RSLinx Classic</b> → Communications → Configure Drivers. Add the <b>1747-UIC (DH-485)</b> driver and start it.","Open <b>RSWho</b> and expand the driver. The 5/03 should appear, normally at <b>node 1</b>.","Leave RSLinx running: RSLogix 500 talks through it."],
        trouble:["<b>No driver in the list:</b> the UIC’s Windows driver isn’t installed, or RSLinx is too old to know the UIC.","<b>Driver runs but RSWho is empty:</b> check the cable is in Channel 1, not Channel 0, and that the PLC is powered.","<b>Node conflicts:</b> RSLinx uses its own node number on DH-485. It must not match the PLC’s (usually 1)."]},

/* ---------- Drawing the cable chain ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function buildChain(m){
  var nodes=m.chain, o="", y=10, W=360, bw=200, x=(W-bw)/2, bh=46, gap=50;
  nodes.forEach(function(n,i){
    var pc=i===0, plc=i===nodes.length-1;
    o+='<rect class="node'+(pc?' pc':plc?' plc':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="8"/>'+
       '<text class="nt" x="'+(W/2)+'" y="'+(y+(n[1]?20:28))+'" text-anchor="middle">'+esc(n[0])+'</text>'+
       (n[1]?'<text class="ns" x="'+(W/2)+'" y="'+(y+36)+'" text-anchor="middle">'+esc(n[1])+'</text>':'');
    if(i<nodes.length-1){
      o+='<line class="cab" x1="'+(W/2)+'" y1="'+(y+bh)+'" x2="'+(W/2)+'" y2="'+(y+bh+gap)+'"/>'+
         '<text class="cl" x="'+(W/2+12)+'" y="'+(y+bh+gap/2+4)+'">'+esc(m.cables[i]||"")+'</text>';
    }
    y+=bh+gap;
  });
  var H=y-gap+10;
  var el=document.getElementById("chain"); el.hidden=false;
  el.innerHTML='<svg viewBox="0 0 360 '+H+'" role="img" aria-label="Connection from the PC to the PLC">'+o+'</svg>';
}

/* ---------- Checklist: ticks are remembered in this browser ---------- */
function ckey(i){ var m=state.step==="conn"?curMeth().id:""; return state.plat+"|"+state.step+"|"+m+"|"+i }
function saveChecks(){ store.set("cn-checks",JSON.stringify(checks)) }
function curMeth(){ var p=P[state.plat], id=state.meth[state.plat]; return p.meth.filter(function(m){return m.id===id})[0]||p.meth[0] }
function buildChecks(items){
  var ol=document.getElementById("checks");
  ol.innerHTML=items.map(function(t,i){ var k=ckey(i), on=!!checks[k];
    return '<li class="'+(on?'done':'')+'"><label><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'><span>'+t+'</span></label></li>' }).join("");
  progress(items.length);
}
function progress(n){
  var c=0; for(var i=0;i<n;i++) if(checks[ckey(i)]) c++;
  document.getElementById("cprog").textContent = c+" of "+n+" done"+(c===n&&n?" ✓":"");
}

/* ---------- Compare table ---------- */
var ROWS=[["Connection","conn"],["Cable","cable"],["Software","soft"],["Find the PLC","find"],["PC → PLC","to"],["PLC → PC","from"],["Run / program mode","mode"],["I/O setup","io"],["Comments and tag names","docs"],["Project file","file"]];
function buildCompare(){
  var h='<table class="cmp"><thead class="sr"><tr><th class="rh" scope="col"> </th>'+PLATS.map(function(k){return '<th scope="col">'+P[k].name+'</th>'}).join("")+'</tr></thead><tbody>';
  ROWS.forEach(function(r){
    h+='<tr'+(r[1]==="to"||r[1]==="from"?' class="key"':'')+'><th class="rh" scope="row">'+r[0]+'</th>'+PLATS.map(function(k){return '<td>'+esc(P[k].terms[r[1]])+'</td>'}).join("")+'</tr>';
  });
  document.getElementById("cmpBox").innerHTML=h+'</tbody></table>';
  var b=document.getElementById("cmpBox"); document.getElementById("swipeHint").hidden = b.scrollWidth<=b.clientWidth+2;
  buildStickHead();
}
/* The PLC-name row is drawn again in its own strip that sticks under the page header.
   It copies the table's column widths and follows the table when it scrolls sideways. */
function buildStickHead(){
  var box=document.getElementById("cmpBox"), head=document.getElementById("stickHead"), tbl=box.querySelector("table");
  if(!tbl) return;
  document.documentElement.style.setProperty("--hdrH", document.querySelector("header.top").offsetHeight+"px");
  var cells=[].slice.call(tbl.querySelector("tbody tr").children), widths=cells.map(function(c){return c.getBoundingClientRect().width});
  head.innerHTML='<table class="cmp" style="width:'+tbl.getBoundingClientRect().width+'px;table-layout:fixed"><thead><tr>'+
    widths.map(function(w,i){ return '<th'+(i===0?' class="rh"':'')+' style="width:'+w+'px;min-width:'+w+'px;max-width:'+w+'px">'+(i===0?"\u00A0":P[PLATS[i-1]].name)+'</th>' }).join("")+'</tr></thead></table>';
  head.scrollLeft=box.scrollLeft;
}
document.getElementById("cmpBox").addEventListener("scroll",function(){ document.getElementById("stickHead").scrollLeft=this.scrollLeft; });
/* Once the strip is stuck, square its corners and cover the sliver above it so the table can't show through */
function markStuck(){
  var h=document.getElementById("stickHead"); if(state.step!=="cmp") return;
  var top=h.getBoundingClientRect().top, hdr=document.querySelector("header.top").getBoundingClientRect().bottom;
  h.classList.toggle("stuck", top<=hdr+1);
}
window.addEventListener("scroll",markStuck,{passive:true});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(state.step==="cmp") buildStickHead(); });

/* ---------- Render ---------- */
function render(){
  var p=P[state.plat], st=state.step, cmp=st==="cmp";
  document.querySelectorAll(".plats button").forEach(function(b){b.setAttribute("aria-pressed",String(!cmp&&b.dataset.plat===state.plat))});
  document.querySelectorAll("#stepSeg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.step===st))});
  document.body.classList.toggle("wide",cmp);
  document.getElementById("cpu").textContent = cmp ? "" : p.cpu;
  document.getElementById("cpu").hidden = cmp;
  document.getElementById("title").textContent = cmp ? STEPTITLE.cmp : STEPTITLE[st]+(st==="down"||st==="up"?": "+p[st].word:"");
  document.getElementById("cmpWrap").hidden=!cmp;
  document.getElementById("checkWrap").hidden=cmp;
  document.getElementById("chain").hidden=true;
  document.getElementById("methWrap").hidden=true;
  var tr=document.getElementById("trouble"), mw=document.getElementById("menuWrap");
  if(cmp){
    document.getElementById("desc").innerHTML="Same jobs, five ways of naming them. The highlighted rows are the words for sending a program to the PLC and getting it back: Allen-Bradley and Siemens say <b>download</b> and <b>upload</b>, AutomationDirect says <b>write</b> and <b>read</b>.";
    tr.hidden=true; mw.hidden=true; buildCompare();
    document.getElementById("noteBox").innerHTML="<p><b>Download vs upload:</b> think of the PLC as “down” on the machine and the PC as “up” above it. Download goes down to the PLC; upload comes up to the PC.</p>";
    return;
  }
  var d, items, trouble, menus;
  if(st==="conn"){
    var m=curMeth();
    if(p.meth.length>1){
      document.getElementById("methWrap").hidden=false;
      document.getElementById("methSeg").innerHTML=p.meth.map(function(x){return '<button data-m="'+x.id+'" aria-pressed="'+(x.id===m.id)+'">'+x.label+'</button>'}).join("");
    }
    d=m.desc; items=m.checks; trouble=m.trouble; menus=null; buildChain(m);
  } else {
    var s=p[st]; d=s.desc; items=s.checks; trouble=s.trouble; menus=s.menus;
  }
  document.getElementById("desc").innerHTML=d;
  mw.hidden=!menus;
  if(menus) document.getElementById("menus").innerHTML=menus.map(function(x){return '<div class="menu">'+x+'</div>'}).join("");
  document.getElementById("checkLbl").textContent = "Checklist";
  buildChecks(items);
  tr.hidden=!trouble;
  if(trouble) tr.innerHTML='<b class="th2">When it doesn’t work</b><ul>'+trouble.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>';
  document.getElementById("noteBox").innerHTML=p.note;
}
document.querySelector(".plats").addEventListener("click",function(e){var b=e.target.closest("button"); if(!b) return; state.plat=b.dataset.plat; store.set("rl-plat",state.plat); if(state.step==="cmp"){ state.step="conn"; store.set("cn-step","conn"); } render();});
document.getElementById("stepSeg").addEventListener("click",function(e){var b=e.target.closest("button"); if(!b) return; state.step=b.dataset.step; store.set("cn-step",state.step); render(); window.scrollTo(0,0);});
document.getElementById("methSeg").addEventListener("click",function(e){var b=e.target.closest("button"); if(!b) return; state.meth[state.plat]=b.dataset.m; render();});
document.getElementById("checks").addEventListener("change",function(e){
  var c=e.target; if(!c.matches("input[type=checkbox]")) return; var k=ckey(+c.dataset.i);
  if(c.checked) checks[k]=1; else delete checks[k]; saveChecks();
  c.closest("li").classList.toggle("done",c.checked); progress(document.querySelectorAll("#checks li").length);
});
document.getElementById("clearBtn").addEventListener("click",function(){
  var n=document.querySelectorAll("#checks li").length; for(var i=0;i<n;i++) delete checks[ckey(i)]; saveChecks(); render();
});
window.addEventListener("resize",function(){ if(state.step==="cmp") buildCompare(); });
render();
})();
</script>
</body>
</html>
